# 每日自動巡檢 56 支 YouTube 鏡頭君是否仍可嵌入播放，輸出結果至 public/health.json
name: Daily Webcam Health Check

on:
  schedule:
    # 台灣時間每日清晨 05:30 (UTC 21:30) 執行
    - cron: "30 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run webcam health check
        run: node scripts/check-webcams.mjs
      - name: Commit updated health.json if changed
        run: |
          if [ -n "$(git status --porcelain public/health.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/health.json
            git commit -m "[maintain] 自動巡檢更新鏡頭健康狀態"
            git push
          fi
